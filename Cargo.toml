[workspace]
exclude = ["vendor/retina"]
resolver = "2"

[package]
name = "ferrissight"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mdai001/FerrisSight"
publish = false
include = ["/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/src/**", "/tests/**", "/docs/**", "/examples/config.example.toml", "/examples/rtsp_probe.rs", "/examples/rtsp_record.rs", "/vendor/retina/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "io-std", "time", "sync"] }
axum = "0.8"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
retina = "0.4.20"
url = "2"
futures-util = "0.3"
mp4 = "0.14"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

rusqlite = { version = "0.40", features = ["bundled"] }
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
debug = false

[patch.crates-io]
retina = { path = "vendor/retina" }
